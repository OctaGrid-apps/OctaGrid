name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: 'Publish MSIX bundle to Microsoft Store'
        required: true
        type: boolean
        default: true
      create_github_release:
        description: 'Create GitHub Release and attach assets'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Package & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore OctaGrid.slnx

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk

      - name: Determine Version
        id: version_info
        shell: pwsh
        run: |
          $tag = ""
          $semver = ""
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match "^v?(\d+\.\d+\.\d+.*)$") {
              # Triggered by a version tag — use the tag itself as the authoritative version
              $semver = $Matches[1]
              $tag = if ($env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v$semver" }
          } else {
              # workflow_dispatch or other trigger — read the fixed version from version.json
              $versionJson = Get-Content "version.json" -Raw | ConvertFrom-Json
              $semver = $versionJson.version.Split('-')[0]
              $tag = "v$semver"
          }

          Write-Host "==> Determined Version: $semver"
          Write-Host "==> Determined Tag:     $tag"

          "version=$semver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Generate Release Notes (Changelog)
        id: release_notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $notesFile = "artifacts/RELEASE_NOTES.md"
          $ghNotesFile = "artifacts/RELEASE_NOTES_GH.md"
          $tag = "${{ steps.version_info.outputs.tag }}"
          $version = "${{ steps.version_info.outputs.version }}"

          # Determine commit range
          # List all version tags sorted by semver, find the one before the current tag
          $allTags = git tag --list "v*" --sort=version:refname 2>$null
          $currentTagIndex = [Array]::IndexOf($allTags, $tag)
          $prevTag = $null
          if ($currentTagIndex -gt 0) {
              $prevTag = $allTags[$currentTagIndex - 1]
          } elseif ($currentTagIndex -lt 0 -and $allTags.Count -gt 0) {
              # workflow_dispatch: tag not yet in repo — use the latest existing tag as base
              $prevTag = $allTags[-1]
          }
          $commits = @()
          if ($prevTag) {
              Write-Host "--> Extracting commits between $prevTag and HEAD ($tag)..."
              $commits = git log "$prevTag..HEAD" --no-merges --pretty=format:"* %s"
          } else {
              Write-Host "--> No previous tag found. Extracting recent commits..."
              $commits = git log -n 20 --no-merges --pretty=format:"* %s"
          }

          $commits = $commits | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          # Categorize conventional commits into readable sections
          $features = @()
          $fixes = @()
          $perf = @()
          $other = @()

          foreach ($c in $commits) {
              if ($c -match '^\*\s*feat(\([^)]+\))?:\s*(.*)$') {
                  $desc = $Matches[2].Trim()
                  $features += "* " + $desc.Substring(0,1).ToUpper() + $desc.Substring(1)
              } elseif ($c -match '^\*\s*fix(\([^)]+\))?:\s*(.*)$') {
                  $desc = $Matches[2].Trim()
                  $fixes += "* " + $desc.Substring(0,1).ToUpper() + $desc.Substring(1)
              } elseif ($c -match '^\*\s*(perf|refactor)(\([^)]+\))?:\s*(.*)$') {
                  $desc = $Matches[3].Trim()
                  $perf += "* " + $desc.Substring(0,1).ToUpper() + $desc.Substring(1)
              } else {
                  if ($c -match '^\*\s*\w+(\([^)]+\))?:\s*(.*)$') {
                      $desc = $Matches[2].Trim()
                      $other += "* " + $desc.Substring(0,1).ToUpper() + $desc.Substring(1)
                  } else {
                      $other += $c
                  }
              }
          }

          $sections = @()
          if ($features.Count -gt 0) {
              $sections += "### Features"
              $sections += $features
              $sections += ""
          }
          if ($perf.Count -gt 0) {
              $sections += "### Improvements & Performance"
              $sections += $perf
              $sections += ""
          }
          if ($fixes.Count -gt 0) {
              $sections += "### Fixes"
              $sections += $fixes
              $sections += ""
          }
          if ($other.Count -gt 0) {
              $sections += "### Other Changes"
              $sections += $other
              $sections += ""
          }

          if ($sections.Count -eq 0) {
              $sections += "* Performance improvements and bug fixes."
          }

          $notes = $sections -join "`n"
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.Encoding]::UTF8)

          # For GitHub Release, append link to full compare diff if prior tag exists
          $ghNotes = $notes
          if ($prevTag -and $env:GITHUB_REPOSITORY) {
              $ghNotes += "`n`n**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$prevTag...$tag"
          }
          [System.IO.File]::WriteAllText($ghNotesFile, $ghNotes, [System.Text.Encoding]::UTF8)

          Write-Host "==> Generated Release Notes for Microsoft Store & Velopack:"
          Write-Host $notes

      - name: Build MSIX Packages
        shell: pwsh
        run: |
          $version = "${{ steps.version_info.outputs.version }}"
          .\build-msix.ps1 -Architectures @('x64', 'arm64') -Configuration Release -OutputDir artifacts -PackageVersion $version -Bundle -Sign

      - name: Build Velopack .EXE App & Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version_info.outputs.version }}"
          $publishDir = "artifacts/publish/win-x64"
          $notesPath = "artifacts/RELEASE_NOTES.md"
          $iconPath = "src/OctaGrid.Client/OctaGrid.Client/Assets/OctaGrid-logo.ico"

          Write-Host "--> Creating Velopack .exe setup package..."
          vpk pack `
            --packId "OctaGrid" `
            --packVersion "$version" `
            --packTitle "OctaGrid" `
            --packAuthors "OctaGrid Contributors" `
            --packDir "$publishDir" `
            --mainExe "OctaGrid.Client.Desktop.exe" `
            --icon "$iconPath" `
            --outputDir "artifacts" `
            --releaseNotes "$notesPath"

          Write-Host "--> Creating portable .zip archive..."
          Compress-Archive -Path "$publishDir\*" -DestinationPath "artifacts/OctaGrid-win-x64-portable.zip" -Force

          Write-Host "==> Artifacts directory contents:"
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Publish to GitHub Releases
        if: ${{ github.event_name == 'push' || inputs.create_github_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: OctaGrid ${{ steps.version_info.outputs.version }}
          body_path: artifacts/RELEASE_NOTES_GH.md
          draft: false
          prerelease: false
          files: |
            artifacts/*-Setup.exe
            artifacts/OctaGrid-win-x64-portable.zip
            artifacts/releases.win.json
            artifacts/*.nupkg

      - name: Setup Microsoft Store CLI
        if: ${{ github.event_name == 'push' || inputs.publish_to_store != false }}
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish to Microsoft Store
        if: ${{ github.event_name == 'push' || inputs.publish_to_store != false }}
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID || '9NWQ15C73TXL' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:AZURE_AD_TENANT_ID -or -not $env:AZURE_AD_CLIENT_ID -or -not $env:AZURE_AD_CLIENT_SECRET -or -not $env:SELLER_ID) {
              Write-Error "Missing required Microsoft Store secrets (AZURE_AD_TENANT_ID, AZURE_AD_CLIENT_ID, AZURE_AD_CLIENT_SECRET, SELLER_ID). Please add them to repository secrets."
              exit 1
          }

          Write-Host "--> Configuring msstore credentials..."
          msstore reconfigure `
            --tenantId "$env:AZURE_AD_TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_CLIENT_ID" `
            --clientSecret "$env:AZURE_AD_CLIENT_SECRET" `
            -v

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to authenticate with Microsoft Partner Center. Check the verbose output above."
              exit 1
          }

          Write-Host "--> Verifying msstore configuration..."
          msstore info
          if ($LASTEXITCODE -ne 0) {
              Write-Error "msstore configuration check failed."
              exit 1
          }

          $productId = $env:STORE_PRODUCT_ID
          $bundlePath = [System.IO.Path]::GetFullPath("artifacts/OctaGrid.msixbundle")
          if (-not (Test-Path $bundlePath)) {
              $bundlePath = (Get-ChildItem -Path "artifacts" -Filter "*.msix" | Select-Object -First 1).FullName
          }

          $notesPath = [System.IO.Path]::GetFullPath("artifacts/RELEASE_NOTES.md")
          $releaseNotes = if (Test-Path $notesPath) { [System.IO.File]::ReadAllText($notesPath) } else { "What's new in this version: Bug fixes and performance improvements." }

          # Microsoft Store allows up to 10,000 characters for release notes
          if ($releaseNotes.Length -gt 9000) {
              $releaseNotes = $releaseNotes.Substring(0, 9000) + "`n`n... (view full changelog on GitHub)"
          }

          Write-Host "--> Uploading package ($bundlePath) to Microsoft Store draft submission..."
          msstore publish "$bundlePath" -id "$productId" --noCommit
          if ($LASTEXITCODE -ne 0) {
              Write-Error "msstore publish (draft) failed."
              exit 1
          }

          Write-Host "--> Fetching current submission draft to attach release notes..."
          $submissionJson = msstore submission get "$productId"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($submissionJson)) {
              Write-Error "Failed to fetch submission details for product $productId."
              exit 1
          }
          $submission = $submissionJson | ConvertFrom-Json

          if ($submission.Listings) {
              $locales = $submission.Listings.PSObject.Properties.Name
              foreach ($locale in $locales) {
                  Write-Host "--> Setting release notes for Store listing locale '$locale'..."
                  $submission.Listings.$locale.BaseListing.ReleaseNotes = $releaseNotes
              }

              $updatedJson = $submission | ConvertTo-Json -Depth 50 -Compress
              Write-Host "--> Updating submission draft with release notes..."
              msstore submission update "$productId" $updatedJson
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to update submission metadata."
                  exit 1
              }
          } else {
              Write-Host "--> No listings found in submission JSON; skipping release notes attachment."
          }

          Write-Host "--> Committing and publishing submission to Microsoft Store for certification..."
          msstore submission publish "$productId"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to publish submission."
              exit 1
          }
          Write-Host "--> Successfully published to Microsoft Store!"
