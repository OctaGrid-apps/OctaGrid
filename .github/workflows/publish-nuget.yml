name: Publish NuGet packages

# Registered as the workflow file of the trusted publishing policy on nuget.org;
# renaming this file means updating that policy.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Pack & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets NuGet/login exchange the GitHub OIDC token for a short-lived API key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches version.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $semver = (Get-Content "version.json" -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$semver") {
              throw "Tag $env:GITHUB_REF_NAME does not match version.json ($semver)."
          }

      - name: Pack
        run: |
          dotnet pack src/OctaGrid.Protocol -c Release -o artifacts/nuget
          dotnet pack src/OctaGrid.Extensions.Abstractions -c Release -o artifacts/nuget
          ls artifacts/nuget

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*

      # Pushing only happens for a release tag; a manual run just builds and uploads the packages.
      # Trusted publishing: trade the GitHub OIDC token for a short-lived nuget.org API key. This does what the
      # NuGet/login action does, inline, because the repository only allows a fixed list of third-party actions.
      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if (-not $env:NUGET_USER) { throw "Set the repository variable NUGET_USER to the nuget.org username that owns the trusted publishing policy." }

          $audience = [uri]::EscapeDataString("https://www.nuget.org")
          $oidc = Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=$audience" `
              -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          Write-Host "::add-mask::$($oidc.value)"

          $body = @{ username = $env:NUGET_USER; tokenType = "ApiKey" } | ConvertTo-Json
          $response = Invoke-RestMethod -Method Post -Uri "https://www.nuget.org/api/v2/token" -ContentType "application/json" `
              -Headers @{ Authorization = "Bearer $($oidc.value)"; "User-Agent" = "octagrid-publish" } -Body $body
          if (-not $response.apiKey) { throw "nuget.org did not return an API key." }
          Write-Host "::add-mask::$($response.apiKey)"

          # Protocol first: Abstractions depends on it. --skip-duplicate makes a re-run harmless.
          foreach ($id in "OctaGrid.Protocol", "OctaGrid.Extensions.Abstractions") {
              dotnet nuget push "artifacts/nuget/$id.*.nupkg" --api-key $response.apiKey --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "Pushing $id failed." }
          }
